name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting (ruff)
        run: ruff format --check .

      - name: Lint codebase (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src tests

      - name: Run unit test suite (pytest)
        run: pytest

      - name: Smoke test CLI
        run: |
          turkce-denetim --version
          turkce-denetim --help
          turkce-denetim README.md
