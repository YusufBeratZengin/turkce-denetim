name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting (ruff)
        run: ruff format --check .

      - name: Lint codebase (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src tests

      - name: Run unit test suite (pytest)
        run: pytest

      - name: Smoke test CLI
        run: |
          turkce-denetim --version
          turkce-denetim --help
          turkce-denetim tests/fixtures/clean.md
          if turkce-denetim tests/fixtures/dirty.md; then exit 1; fi

      - name: Smoke test installed wheel outside source tree
        run: |
          python -m build --wheel
          mkdir -p "$RUNNER_TEMP/wheel-test"
          cd "$RUNNER_TEMP/wheel-test"
          python -m pip install --force-reinstall "$GITHUB_WORKSPACE"/dist/*.whl
          turkce-denetim --version
          python -c "import turkce_denetim; from turkce_denetim import analyze_text, Config; r = analyze_text('Doğal ve temiz Türkçe.', Config()); assert r.word_count == 4"
